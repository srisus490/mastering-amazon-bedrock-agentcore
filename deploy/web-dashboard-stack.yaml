AWSTemplateFormatVersion: '2010-09-09'
Description: 'File Monitoring Web Dashboard - S3 static hosting behind CloudFront'

Parameters:
  BackendApiUrl:
    Type: String
    Description: >
      Full URL of the deployed backend API (e.g. http://my-alb.us-east-1.elb.amazonaws.com).
      Written into config/config.json so the dashboard can reach the API.

Resources:

  # ── S3 bucket (private; CloudFront is the only allowed reader) ──────────────
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'file-monitoring-web-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  # ── CloudFront Origin Access Control (sigv4-signed requests to S3) ──────────
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'file-monitoring-oac-${AWS::StackName}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── Bucket policy: allow only CloudFront to read ────────────────────────────
  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub >-
                  arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

  # ── CloudFront distribution ──────────────────────────────────────────────────
  WebDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: WebBucketPolicy
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100          # US / EU / Asia edge locations

        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''      # must be empty when using OAC

        # Default behaviour: cache static assets aggressively
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          # AWS managed "CachingOptimized" policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # AWS managed "SecurityHeadersPolicy"
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          AllowedMethods: [GET, HEAD, OPTIONS]

        # config/*.json: never cache so backend URL changes take effect immediately
        CacheBehaviors:
          - PathPattern: 'config/*'
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            # AWS managed "CachingDisabled" policy
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            AllowedMethods: [GET, HEAD]

        # SPA fallback: serve index.html for any 403/404 (no server-side routing)
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

Outputs:
  BucketName:
    Description: S3 bucket that holds the dashboard files
    Value: !Ref WebBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  CloudFrontDistributionId:
    Description: CloudFront distribution ID (needed to create invalidations)
    Value: !Ref WebDistribution
    Export:
      Name: !Sub '${AWS::StackName}-DistributionId'

  DashboardURL:
    Description: Public URL of the web dashboard
    Value: !Sub 'https://${WebDistribution.DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-DashboardURL'
