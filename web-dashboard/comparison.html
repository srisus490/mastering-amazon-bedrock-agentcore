<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Comparison Report</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #080c14;
            --surface:   #0f1623;
            --surface2:  #151d2e;
            --border:    rgba(99,179,237,0.12);
            --glow-blue: #3b82f6;
            --glow-cyan: #06b6d4;
            --glow-purple:#8b5cf6;
            --text:      #e2e8f0;
            --muted:     #64748b;
            --green:     #22c55e;
            --yellow:    #f59e0b;
            --red:       #ef4444;
            --crimson:   #dc2626;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background mesh */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59,130,246,0.07) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(139,92,246,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 50% 30% at 50% 50%, rgba(6,182,212,0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── HEADER ── */
        .header {
            position: relative;
            z-index: 10;
            padding: 0 40px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15,22,35,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .header-left h1 {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-left .meta {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 20px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(59,130,246,0.35);
            transition: box-shadow 0.2s, transform 0.15s;
        }
        .back-btn:hover {
            box-shadow: 0 0 30px rgba(59,130,246,0.55);
            transform: translateY(-1px);
        }

        /* ── BODY ── */
        .body {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 0 auto;
            padding: 36px 40px 60px;
        }

        /* ── SUMMARY CARDS ── */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        @media (max-width: 900px) { .summary-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }

        .stat-card {
            background: linear-gradient(145deg, var(--surface) 0%, var(--surface2) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 22px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--glow-blue), var(--glow-cyan));
            opacity: 0.7;
        }
        .stat-card .icon {
            font-size: 1.4rem;
            margin-bottom: 10px;
            display: block;
        }
        .stat-card .label {
            font-size: 0.72rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }
        .stat-card .value {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-card.danger .value  { background: linear-gradient(135deg, #ef4444, #dc2626); -webkit-background-clip: text; background-clip: text; }
        .stat-card.success .value { background: linear-gradient(135deg, #22c55e, #16a34a); -webkit-background-clip: text; background-clip: text; }
        .stat-card.warn .value    { background: linear-gradient(135deg, #f59e0b, #d97706); -webkit-background-clip: text; background-clip: text; }

        /* ── SECTION WRAPPER ── */
        .section {
            background: linear-gradient(145deg, var(--surface) 0%, var(--surface2) 100%);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 28px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }

        .section-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.02);
        }
        .section-header h2 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.02em;
        }
        .section-header .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--glow-blue);
            box-shadow: 0 0 8px var(--glow-blue);
        }

        /* ── BAR CHART ── */
        .bar-chart { padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; }

        .bar-row { display: flex; align-items: center; gap: 14px; }

        .bar-label {
            width: 170px;
            font-size: 0.8rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
            transition: color 0.2s;
        }
        .bar-row:hover .bar-label { color: var(--text); }

        .bar-track {
            flex: 1;
            height: 22px;
            background: rgba(255,255,255,0.04);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .bar-fill {
            height: 100%;
            border-radius: 6px;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            box-shadow: 0 0 10px rgba(59,130,246,0.4);
            position: relative;
            transition: width 0.8s cubic-bezier(0.16,1,0.3,1);
        }
        /* Shimmer on bar */
        .bar-fill::after {
            content: '';
            position: absolute;
            top: 0; left: -60%;
            width: 40%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
            animation: shimmer 2.4s infinite;
        }
        @keyframes shimmer {
            0%   { left: -60%; }
            100% { left: 120%; }
        }

        .bar-count {
            width: 44px;
            text-align: right;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text);
        }

        /* ── TABLE ── */
        .table-scroll { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        thead tr {
            background: rgba(255,255,255,0.03);
        }

        th {
            padding: 13px 18px;
            text-align: left;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 13px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            vertical-align: middle;
        }

        tbody tr {
            transition: background 0.15s;
        }
        tbody tr:hover {
            background: rgba(59,130,246,0.05);
        }
        tbody tr:last-child td { border-bottom: none; }

        /* Rank */
        .rank {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px; height: 28px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.06);
            color: var(--muted);
        }
        .rank-1 { background: linear-gradient(135deg,#f59e0b,#d97706); color:#fff; box-shadow:0 0 12px rgba(245,158,11,0.5); }
        .rank-2 { background: linear-gradient(135deg,#94a3b8,#64748b); color:#fff; box-shadow:0 0 10px rgba(148,163,184,0.3); }
        .rank-3 { background: linear-gradient(135deg,#b45309,#92400e); color:#fff; box-shadow:0 0 10px rgba(180,83,9,0.4); }

        /* System name */
        .sys-name {
            font-weight: 700;
            color: var(--text);
            font-size: 0.875rem;
        }

        /* SLA bar */
        .sla-wrap { display: flex; align-items: center; gap: 10px; min-width: 140px; }
        .sla-track {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
        }
        .sla-fill { height: 100%; border-radius: 3px; }
        .sla-good   { background: linear-gradient(90deg,#22c55e,#16a34a); box-shadow:0 0 6px rgba(34,197,94,0.5); }
        .sla-warn   { background: linear-gradient(90deg,#f59e0b,#d97706); box-shadow:0 0 6px rgba(245,158,11,0.5); }
        .sla-bad    { background: linear-gradient(90deg,#ef4444,#dc2626); box-shadow:0 0 6px rgba(239,68,68,0.5); }
        .sla-score  { font-weight: 700; font-size: 0.85rem; white-space: nowrap; min-width: 36px; }

        /* Severity badge */
        .sev {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .sev-dot { width: 6px; height: 6px; border-radius: 50%; }
        .sev-critical { background:rgba(220,38,38,0.2);  color:#ff6b6b; border:1px solid rgba(220,38,38,0.4); }
        .sev-critical .sev-dot { background:#ef4444; box-shadow:0 0 6px #ef4444; }
        .sev-high     { background:rgba(239,68,68,0.15); color:#fca5a5; border:1px solid rgba(239,68,68,0.3); }
        .sev-high .sev-dot     { background:#f87171; box-shadow:0 0 5px #f87171; }
        .sev-medium   { background:rgba(245,158,11,0.15);color:#fcd34d; border:1px solid rgba(245,158,11,0.3); }
        .sev-medium .sev-dot   { background:#fbbf24; box-shadow:0 0 5px #fbbf24; }
        .sev-low      { background:rgba(59,130,246,0.15);color:#93c5fd; border:1px solid rgba(59,130,246,0.3); }
        .sev-low .sev-dot      { background:#60a5fa; box-shadow:0 0 5px #60a5fa; }
        .sev-none     { background:rgba(34,197,94,0.12); color:#86efac; border:1px solid rgba(34,197,94,0.25); }
        .sev-none .sev-dot     { background:#4ade80; box-shadow:0 0 5px #4ade80; }

        /* Violation pills */
        .viol-pills { display:flex; gap:4px; flex-wrap:wrap; }
        .vp {
            font-size: 0.7rem;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 600;
        }
        .vp-c { background:rgba(220,38,38,0.2);  color:#fca5a5; }
        .vp-h { background:rgba(239,68,68,0.15); color:#fca5a5; }
        .vp-m { background:rgba(245,158,11,0.15);color:#fcd34d; }
        .vp-l { background:rgba(59,130,246,0.15);color:#93c5fd; }
        .vp-none { color:var(--muted); font-size:0.78rem; }

        .ts { font-size:0.78rem; color:var(--muted); }

        /* Loading / error */
        .loading {
            text-align: center;
            padding: 80px 20px;
            color: var(--muted);
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(59,130,246,0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-msg { text-align:center; padding:60px; color:#ef4444; }
    </style>
</head>
<body>

<header class="header">
    <div class="header-left">
        <h1>System Comparison Report</h1>
        <div class="meta" id="report-meta">Loading…</div>
    </div>
    <a href="index.html" class="back-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back to Dashboard
    </a>
</header>

<div class="body">
    <div id="report-content">
        <div class="loading">
            <div class="spinner"></div>
            Loading comparison data…
        </div>
    </div>
</div>

<script type="module">
const API = 'http://localhost:8000';

const params = new URLSearchParams(window.location.search);
const startDate = params.get('start_date');
const endDate   = params.get('end_date');

function slaClass(s) {
    if (s === null || s === undefined) return 'sla-warn';
    return s >= 95 ? 'sla-good' : s >= 80 ? 'sla-warn' : 'sla-bad';
}

function slaColor(s) {
    if (s === null || s === undefined) return '#f59e0b';
    return s >= 95 ? '#22c55e' : s >= 80 ? '#f59e0b' : '#ef4444';
}

function sevBadge(sev) {
    const label = sev ? sev.toUpperCase() : 'HEALTHY';
    const cls   = sev ? `sev-${sev}` : 'sev-none';
    return `<span class="sev ${cls}"><span class="sev-dot"></span>${label}</span>`;
}

function violPills(v) {
    if (!v || v.total === 0) return '<span class="vp-none">None</span>';
    const p = [];
    if (v.critical) p.push(`<span class="vp vp-c">${v.critical} crit</span>`);
    if (v.high)     p.push(`<span class="vp vp-h">${v.high} high</span>`);
    if (v.medium)   p.push(`<span class="vp vp-m">${v.medium} med</span>`);
    if (v.low)      p.push(`<span class="vp vp-l">${v.low} low</span>`);
    return `<div class="viol-pills">${p.join('')}</div>`;
}

async function load() {
    let url = `${API}/api/v1/chat/compare`;
    const qs = [];
    if (startDate) qs.push(`start_date=${startDate}`);
    if (endDate)   qs.push(`end_date=${endDate}`);
    if (qs.length) url += '?' + qs.join('&');

    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        render(await res.json());
    } catch (e) {
        document.getElementById('report-content').innerHTML =
            `<div class="error-msg">⚠ Failed to load: ${e.message}</div>`;
    }
}

function render(data) {
    document.getElementById('report-meta').textContent =
        `Period: ${data.date_label}  ·  Generated: ${data.generated_at}`;

    const sys = data.systems;
    const maxFiles    = Math.max(...sys.map(s => s.file_count), 1);
    const totalFiles  = sys.reduce((a, s) => a + s.file_count, 0);
    const slaArr      = sys.filter(s => s.sla_score !== null).map(s => s.sla_score);
    const avgSLA      = slaArr.length ? (slaArr.reduce((a,b)=>a+b,0)/slaArr.length).toFixed(1) : null;
    const totalViols  = sys.reduce((a, s) => a + (s.violations?.total || 0), 0);
    const critCount   = sys.filter(s => s.worst_severity === 'critical').length;

    const slaCardClass  = avgSLA === null ? '' : avgSLA >= 95 ? 'success' : avgSLA >= 80 ? 'warn' : 'danger';
    const critCardClass = critCount > 0 ? 'danger' : 'success';

    document.getElementById('report-content').innerHTML = `

        <div class="summary-grid">
            <div class="stat-card">
                <span class="icon">🖥️</span>
                <div class="label">Total Systems</div>
                <div class="value">${sys.length}</div>
            </div>
            <div class="stat-card">
                <span class="icon">📁</span>
                <div class="label">Total Files</div>
                <div class="value">${totalFiles.toLocaleString()}</div>
            </div>
            <div class="stat-card ${slaCardClass}">
                <span class="icon">📊</span>
                <div class="label">Avg SLA Score</div>
                <div class="value">${avgSLA ?? 'N/A'}</div>
            </div>
            <div class="stat-card ${totalViols > 0 ? 'warn' : 'success'}">
                <span class="icon">⚠️</span>
                <div class="label">Total Violations</div>
                <div class="value">${totalViols}</div>
            </div>
            <div class="stat-card ${critCardClass}">
                <span class="icon">🔴</span>
                <div class="label">Critical Systems</div>
                <div class="value">${critCount}</div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="dot"></div>
                <h2>File Volume Ranking</h2>
            </div>
            <div class="bar-chart">
                ${sys.map(s => `
                    <div class="bar-row">
                        <div class="bar-label" title="${s.system_id}">${s.system_id}</div>
                        <div class="bar-track">
                            <div class="bar-fill" style="width:${(s.file_count/maxFiles*100).toFixed(1)}%"></div>
                        </div>
                        <div class="bar-count">${s.file_count.toLocaleString()}</div>
                    </div>
                `).join('')}
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="dot" style="background:var(--glow-purple);box-shadow:0 0 8px var(--glow-purple)"></div>
                <h2>Full System Comparison</h2>
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>System</th>
                            <th>Files</th>
                            <th>Size</th>
                            <th>SLA Score</th>
                            <th>Violations</th>
                            <th>Severity</th>
                            <th>Last Arrival</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${sys.map((s, i) => {
                            const rank = i + 1;
                            const rc   = rank <= 3 ? `rank-${rank}` : '';
                            const sc   = s.sla_score;
                            const barW = sc !== null ? sc : 0;
                            const bc   = slaClass(sc);
                            const scoreColor = slaColor(sc);
                            return `
                            <tr>
                                <td><span class="rank ${rc}">${rank}</span></td>
                                <td><span class="sys-name">${s.system_id}</span></td>
                                <td><strong>${s.file_count.toLocaleString()}</strong></td>
                                <td class="ts">${s.total_size}</td>
                                <td>
                                    <div class="sla-wrap">
                                        <div class="sla-track">
                                            <div class="sla-fill ${bc}" style="width:${barW}%"></div>
                                        </div>
                                        <span class="sla-score" style="color:${scoreColor}">${sc !== null ? sc.toFixed(1) : 'N/A'}</span>
                                    </div>
                                </td>
                                <td>${violPills(s.violations)}</td>
                                <td>${sevBadge(s.worst_severity)}</td>
                                <td class="ts">${s.last_arrival}</td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

load();
</script>
</body>
</html>
